irement (MEASURED plus FULL_LOCK) rather than lock_class alone, and derives that flag instead of trusting it. LB-01..LB-12 pass over 62 tests, including LB-12 which re-hashes rl/train_ppo.py, rl/eval_policy.py and backend/simulator.py against the digests pinned at the freeze, so the promise not to edit them is machine-checked rather than asserted. Not cleared: a sidecar can be omitted so a direct driver invocation still yields RUN_LOCK_UNBOUND, backend/simulator.py meta.provenance stays explicitly out of scope because it enters a deterministic content hash that test_p0_contract.py independently recomputes and /api/simulate is a stateless response rather than a retained run, and the 2026-09-08 bundle is not regenerated. paper_data_ready unchanged at false; this is infrastructure, not evidence"

docs: "README.md is the entry point; docs/PROJECT_STATUS.md is the human-readable status report; docs/PUBLICATION_PLAN.md defines the three publication tracks and their PUB gates (V3); docs/TRACK_A_REFRAME_2026-09-09.md is the Track A reframe and PUB-A2 claim-freeze draft; docs/R0_REGIME_PROBE_SPEC.md is the frozen R0-REGIME-HORIZON-PROBE-V1 that tests whether the taxonomy's empty R0 cell is reachable along the horizon dimension, with docs/R0_REGIME_PROBE_RECEIPT_2026-09-11.md recording its executed result; docs/MOTION_SCOPE_DECISION_2026-09-11.md records the decision not to add a jump or turn task now and the frozen ordering for adding one later; docs/SECOND_CASE_EXPOSURE_CENSORING_SPEC.md defines the frozen PUB-A1 second-case protocol (V1, executed); docs/SECOND_CASE_V2_BUDGET_PROBE_RECEIPT_2026-09-08.md records the three budget probes and the 2026-09-09 decision that closed the line; docs/LITERATURE_MAP_2026-09-08_EVALUATION_VALIDITY.md positions Track A against prior work; docs/V7_CANDIDATE_SELECTION_SPEC.md defines the frozen, openly non-preregistered candidate-selection rule and its authorization gate; docs/PUB_B0_AUTHORIZATION_RECEIPT_2026-09-10.md records the 2026-09-10 formal-evaluation authorization, the four remaining blockers and the SEL-C2 feasibility measurement; docs/ENVIRONMENT_LOCK_SPEC.md defines measured software-environment identity; docs/TRAINING_SEED_VARIANCE_SPEC.md defines the frozen independent training-seed variance protocol; docs/V7_EXPOSURE_CENSORING_AUDIT_SPEC.md defines the read-only exposure-censoring audit; docs/PAPER_DATA_READINESS.md defines the paper-data architecture and gates; docs/REPOSITORY_GUIDE.md defines Git/artifact policy; docs/MODEL_CARD.md defines claim boundaries; docs/VV_PLAN.md defines gates; docs/EXPERIMENT_PROTOCOL.md defines formal runs; docs/HARDWARE_DATA_PROVENANCE.md defines hardware evidence classes"

track_a_reframe: "TRACK-A-REFRAME-2026-09-09 (docs/TRACK_A_REFRAME_2026-09-09.md): the Track A thesis, the five-regime censoring taxonomy with every measured instance and its receipt digests, the V2 contribution list, a 14-row claim-to-evidence table that is the PUB-A2 claim-freeze draft, an 11-item non-claims and limitations list led by the fact that the asymmetric regime R1 was measured only on the project humanoid plant, a figure/table plan whose every input is a retained hash-bound JSON, and, added 2026-09-16, section 3.7: the tracked-lineage V1/V2 line folded in as a WORKED EXAMPLE of regime R4 whose literature anchor was source-verified the same day (arXiv 2010.04304 read in full; the A-C3 reinforcement moved from INFERENCE on an unverified entry to RESULT on a verified one), which until then rested on two pilots alone. It is not a new experiment - the line was executed for PUB-B2 and measured exactly R4: five replicates at 0/30 full exposure under both a 2000000-step and a realized 4015200-step budget, label TL2_BUDGET_EXHAUSTED computed by the contract runner over version-controlled evidence (tl2_contract_receipt.json sha256:0cd90e12a9ca4090c798c73c4699a18d7aebba3f1b6e686275b60a2ae3db9e15, protocol sha256:a38662d99c6c6a25015e3ab5f8d642b0bc601be8b1d5d157d7f5e00b8d9292d0), so R4 gains a DEVELOPMENT frozen-protocol instance beside the two pilots. It also supplies a MECHANISM the taxonomy lacked: the PROJECT_ASSESSMENT section 1.4 reward decomposition matches the measured returns (standing about 2.5 per step, about 310 over 125 steps, minus the 50 termination penalty about 260, against measured 227-232 and 283-295), and doubling the budget moved reward and survival while leaving exposure at exactly 0/30 on all five. The load-bearing consequence is for A-C3: the LITERATURE_MAP_2026-09-16_TRAINING_STRATEGY scan finds the shaping-induced standing local optimum is a NAMED AND ABLATED failure mode in the locomotion literature, so landing in R4 is EXPECTED on shaped locomotion tasks rather than an idiosyncrasy of this plant - which makes reference adequacy a reward-design variable that standard evaluation neither controls nor reports. Bounded hard: the line is single-arm and yields NO paired bound, not_independent_of_v1 is true so V1 and V2 are not two independent observations, its numbers may not be differenced or trended against v7 or Walker2d, it does not support that more steps would reach 30/30, and the reward decomposition is arithmetic about that reward function, not a claim about the plant, the controller or any locomotion method, the PUB-A gates as revised, and the disposition of the closed second-case line; nothing in it changes paper_data_ready, statistics_ready, method_level_power_ready or sample_size_decision_input_ready, all false"

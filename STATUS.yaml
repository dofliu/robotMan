next_milestone: "Two tracks in parallel under PUBLICATION-PLAN-V3 (docs/PUBLICATION_PLAN.md): academic - Track A was reframed on 2026-09-09 as an evaluation-validity study of censoring regimes (docs/TRACK_A_REFRAME_2026-09-09.md) after the project owner stopped the second-case V2 line following three budget probes; PUB-A1a is PASS on the existing Walker2d V1 receipt, PUB-A1b is CLOSED_NOT_ATTAINED and no further second-case probe or protocol is opened; next is completing PUB-A0 (the two key papers, arXiv 1911.05728 and 2606.10229, were verified in full from owner-supplied PDFs on 2026-09-09 and neither closes the gap; the A-C5 supplementary scan was completed on 2026-09-10 and demoted that contribution; the only remaining PUB-A0 work is reading the primary sources of the U entries in docs/LITERATURE_MAP_2026-09-08_EVALUATION_VALIDITY.md sections 1.1, 1.3-1.5, 1.7 and 2, which the execution environment blocks, with Pardo 2018, Colas 2019, Manski 1990 with Tamer 2010, and Hollenbeck and Wright 2017 as the four priorities) plus the rl-zoo recipe check, then freezing PUB-A2 from the reframe claim-to-evidence table; engineering - the ENVIRONMENT-LOCK-V1 binding was implemented on 2026-09-13 as RUN-MANIFEST-LOCK-BINDING-V1 and narrowed rather than cleared the V0 blocker, so what remains is starting a training line with version-controlled checkpoint lineage; on 2026-09-11 the project owner decided NOT to add a jump or turn motion task now (see motion_scope_decision), so no new motion task precedes those two; decision (project owner only) - the two PUB-B0 sub-questions. PUB-B0 authorization was GRANTED on 2026-09-10 (docs/PUB_B0_AUTHORIZATION_RECEIPT_2026-09-10.md) and that is a decision, not a state change: SELECT-V7-CANDIDATE-FORMAL-V1 is still frozen, openly non-preregistered, enforced by a fail-closed gate, and still not executable and must not be executed - EP-01 v7_exposure_audit_contract._episode_exposure raises on any seed in SEALED_SEED_RANGE so FORMAL episodes cannot be classified at all, EP-02 both branches of rl/eval_policy.py pin the evaluation seed schedule so no path accepts 20000-20029, and EP-03 is hard-coded BLOCKING in the frozen protocol JSON that assert_executable reads, so resolving it needs a narrowing-only execution-before amendment plus a re-pinned PROTOCOL_SHA256; the frozen order is authorization first, external preregistration (PUB-B4, project owner only) second, unsealing last, so seeds 20000-20029 were not accessed on 2026-09-10 and must not be. The two open sub-questions are (a) use the existing post-hoc rule or preregister an alternative, and (b) which training line the single un-inspected FORMAL seed range is spent on, because the receipt measured that SEL-C2 almost certainly cannot pass on the v7 line: on the retained seed-variance evidence the V7A reference itself is only 143/150 COMPARABLE, V7B 120/150 and V7C 0/150, and FORMAL reuses the same 15 trained policies with only the evaluation seeds changed, so the iid-extrapolated joint pass probability is 2.2e-18 for reference+V7B and 0 for reference+V7C; independent PRETRAINING-seed variance is closed by evidence rather than pending, so CONDITIONAL_ON_FIXED_WARM_START is permanent for the v7 line; no selection, threshold change, machine-readable authorization evidence or FORMAL access until (a) and (b) are decided and PUB-B4 is done"

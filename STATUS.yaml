tracked_lineage_training_status: "EXECUTED_PUB_B1_ATTAINED_PUB_B2_NOT_ATTAINED: TRACKED-LINEAGE-TRAINING-V1 (docs/TRACKED_LINEAGE_TRAINING_SPEC.md sha256:1919bf8a65f916cffcad46c4f420110fc3ad8885ebb0140f83fa0c4dda03a1f6 after amendments 01, 02 and 03, backend/rl/tracked_lineage_training_protocol.json sha256:0b29672ed9b92a5d805a62e5e04d354bb6152150177642bd9cdaa03bdd4a9946, receipt docs/TRACKED_LINEAGE_TRAINING_RECEIPT_2026-09-14.md) was frozen and EXECUTED IN FULL on 2026-09-14. RESULT LABEL TL_BUDGET_EXHAUSTED, corrected by amendment 03 from the TL_REFERENCE_NOT_ATTAINED first published: all five replicates trained clean and produced a version-controlled checkpoint lineage, so PUB-B1 is ATTAINED, but no replicate's reference policy reached the 30/30 full-exposure threshold, so PUB-B2 is NOT_ATTAINED and PUB-B3 stays blocked. Measured: 5 replicates at seeds 9100/9112/9124/9136/9148, each realizing exactly 2015232 timesteps as amendment 01 predicted, warm_start and resume null throughout, 20 retained checkpoints totalling 39899261 bytes (38.0 MiB) at 499992/999984/1499976/1999968 per replicate, none gitignored, every digest and size matching the bytes on disk; all 10 executions (5 training, 5 evaluation) returned RUN_LOCK_BOUND under a MEASURED_ENVIRONMENT_LOCK + FULL_LOCK + AMBIENT_THREADING_PINNED record whose locked_sha256 sha256:93d23a27 is byte-identical to the 2026-09-08 seedvar execution, so this line ran in the same measured environment as the line it succeeds. Each replicate was evaluated on its TL-CK-04 reference policy, the last retained checkpoint at 1999968 steps, over DEV seeds 22000-22029: full exposure was 0/30 for every one of the five, fall_rate 1.0 for every one, and all 150 episodes ended with outcome_state NULL. Per-replicate mean duration_s was 2.477333 / 2.680000 / 2.520000 / 2.811333 / 2.440000 against a 9.0 s task, mean of the five 2.585733, with falls clustered around the 2.5 s STEADY_WALK transition and mean_saturation_duty_pct 0.0 - the scratch policy learned to stand and not to start walking. 150 is a FORBIDDEN DENOMINATOR: the method-level result is 0 of 5 replicates attaining, never 0/150. LABEL CORRECTION (amendment 03, applied after the first label was published and merged): section 9 defines TL_BUDGET_EXHAUSTED as the threshold not being reached AND the curve not having converged, which is TL_REFERENCE_NOT_ATTAINED's condition plus one more, so both could hold at once and section 9 never said which to report. The first analysis never measured convergence at all - classify() was written with budget_exhausted: bool = False and that default was accepted - so the more specific label could not have been reached. Measured afterwards under a rule declared before application (converged iff the final-quarter reward slope is at most 10 percent of the first-quarter slope AND at most 1.0 in absolute value, per 500000 steps): ratios were 0.377, 0.403, 0.536, 0.475 and 0.341 with final-quarter slopes from +7.309 to +11.888, so NONE of the five converged and the correct label is TL_BUDGET_EXHAUSTED. Nothing measured changed - 0/30 on all five, fall_rate 1.0, 2015232 steps, 20 checkpoints - and PUB-B2 is NOT_ATTAINED under either label since only TL_REFERENCE_ATTAINED passes it. The correction makes what follows HARDER, not easier: section 9 attaches to TL_BUDGET_EXHAUSTED a rule the other label lacks, that the ceiling may not be raised on the grounds that a little more training would have reached the threshold. classify() now requires curve_converged as a keyword argument with no default so the determination cannot be skipped again, and the training curves - which lived in gitignored backend/rl/artifacts/ and would have died with the container, the same trap that cost the v7 pilot its control_step_trace - are retained with digests under backend/tracked_lineage_evidence/2026-09-14/training_curves/. It remains true that the curve not having converged says only that training had not stopped improving; it says nothing about where it would converge or whether it would ever cross 30/30, and claiming otherwise would need an execution that needs a new protocol. This outcome was PRE-DECLARED before any curve existed in specification sections 3, 4.2 and 9, which recorded that v5 reached Live 10/11 only through a v1 to v5 curriculum, that a single scratch run may not get there, and that 30/30 would plausibly return TL_REFERENCE_NOT_ATTAINED; it is a RESULT, not a failure, and the threshold may never be lowered on account of it. Every acceptance criterion passed - TL-01, TL-01b, TL-02..TL-08 and TL-CK-01..TL-CK-06 - so this is a clean measurement with a negative result and NOT TL_METHOD_FAILURE; in particular TL_EXPOSURE_SIGNALS_DISAGREE never fired across all 150 episodes, so the two exposure signals agreed rather than contradicting each other. The line is DEVELOPMENT: it does not unseal 20000-20029, does not touch SELECT-V7-CANDIDATE-FORMAL-V1, supports no comparison with the v7 line (different driver, start, seeds and environment), and supports no claim that scratch training is infeasible or that a curriculum is necessary, since only one recipe and one budget were run with no control. Measured throughput was 1133.5 steps/s and 2.469 hours in total, correcting specification section 5's seedvar-derived estimate of about 1683 steps/s and 1.7 hours - an estimate, not a frozen parameter, so no threshold changed. The repository's .git grew from 11 MB to 47 MB, inside the about 49 MB named and accepted in section 4.1. Next steps are owner decisions recorded in receipt section 10 (raise the budget, introduce a curriculum, change reward or environment, or solve PUB-B3 another way); each needs a NEW PROTOCOL VERSION disclosing it was designed with this result already known, the 2000000-step ceiling may not be raised after the fact, and the 20 retained checkpoints may never be deleted because they are PUB-B1's only output. It was frozen on 2026-09-14 and pushed before any driver edit, as its own section 10 execution order requires; at that push backend/rl/train_ppo.py, backend/rl/eval_policy.py and backend/simulator.py were byte-identical to sha256:877da3b4, sha256:0cf27434 and sha256:c27e00a0. It exists because everything the v7 line measured carries CONDITIONAL_ON_FIXED_WARM_START permanently, so PUB-B3's point-valued between-replicate SD needs a line whose PRETRAINING provenance can be reconstructed. It narrows ROADMAP section 9 item 2 from 'scratch or tracked warm start' to scratch: the only warm-start candidate in version control is the v5 artifact, whose FILE is reproducible by digest but whose TRAINING is not, and warm-starting from it would preserve the exact defect the line exists to remove. Frozen design: 5 replicates from scratch (warm_start_policy_id and resume both null), training seeds 9100/9112/9124/9136/9148 disjoint from all 11 existing ones with non-overlapping environment seed blocks, parallel_envs 12, a ceiling of 2000000 steps per replicate that may never be raised on account of a result, evaluation seeds 22000-22029 with 18000-18029 EXHAUSTED, 19000-19029 retired and 20000-20029 sealed all forbidden, and 30 episodes per replicate. The project owner fixed the two open slots on 2026-09-14 BEFORE any training curve existed, which is the only fact about them that matters: CHECKPOINT_STORAGE is GIT_DIRECT with checkpoint_interval 500000, giving 4 checkpoints per replicate and 20 in total at about 38 MB, chosen because it is the only option that is both offline-verifiable and free of new infrastructure - git lfs is not installed, and RELEASE_ASSETS and EXTERNAL_IMMUTABLE both need network to verify while release assets can be deleted or altered by anyone with write access; and FULL_EXPOSURE_THRESHOLD is 30/30 = 1.000000 judged per replicate, because any early termination leaves the reference censored, which is precisely why between_replicate_sd is null on the v7 line, and 29/30 would reproduce that in milder form while 28/30 is looser than the V7A reference's own 143/150 = 0.953333. Two costs were accepted at decision time and may not later be treated as surprises: the repository grows from about 11 MB to about 49 MB with every future line adding more, and a scratch policy reaching 30/30 on all five replicates is a high bar that will plausibly return TL_REFERENCE_NOT_ATTAINED - a threshold may never be lowered on account of a result, and missing it is PUB-B2 NOT_ATTAINED, which is a result. Scope is deliberately narrowed to PUB-B1 and PUB-B2: this line does NOT modify rl/eval_policy.py, because control_step_trace is written only when pilot_interface is not None at rl/eval_policy.py:391 and editing that driver would turn test_v7_candidate_selection_contract.py::test_precondition_digests_match_the_pinned_sources red, leaving the owner's 2026-09-10 authorization pointing at a protocol that no longer exists, so the line produces no saturation, no censoring-regime classification and nothing comparable with V7_EXPOSURE_CENSORING_AUDIT, and PUB-B3 needs a separate protocol that must first resolve that owner-gated question. Full exposure is measured instead from the generic path's duration_s, which rl/eval_policy.py:325 computes as round(len(rewards) * 0.02, 3), so 450 control steps gives 9.0 and 449 gives 8.98 - cleanly separable - cross-checked against outcome_state. The generic path has no _EVALUATION_SEED_SCHEDULE_OVERRIDE_FORBIDDEN guard unlike the v7 and seedvar paths, so seed-schedule enforcement is ANALYSIS TIME ONLY and acceptance criterion TL-01b requires the retained evaluation_seeds to be exactly 22000..22029 or the run is TL_METHOD_FAILURE. Five fail-closed labels TL_REFERENCE_ATTAINED / TL_REFERENCE_PARTIAL / TL_REFERENCE_NOT_ATTAINED / TL_BUDGET_EXHAUSTED / TL_METHOD_FAILURE, the first four results to be reported and the last never downgraded; checkpoint rules TL-CK-01..TL-CK-05 include TL-CK-04, which freezes the reference-selection rule as the last checkpoint of each replicate BEFORE any evaluation result is seen, because v5's checkpoint was picked after its results were seen out of a run that had regressed. Analysis unit is the training replicate with method-level denominator 5 and 30, 150 and 450 as forbidden denominators. All three pinned layers are now complete: the protocol pins the specification, backend/tracked_lineage_contract.py pins the protocol, and source_baseline.training_driver_source_sha256 is pinned to sha256:2a3f50c0, the digest of train_ppo.py after this line's edit. It was null at freeze by construction, because pinning a digest for a driver change not yet made would be a pin written after the fact. The superseded sha256:877da3b4 that SEEDVAR-V7-TRAINING-REPLICATE-DEV-V1 pins is retained alongside it as the disclosure RUN_MANIFEST_LOCK_BINDING_SPEC section 15.4 requires, and nothing re-derives that pin at runtime, so from this commit it is no longer true of the live repository - which is the fact this protocol exists to disclose. rl/eval_policy.py is byte-identical to sha256:0cf27434 and TL-01 re-derives both before every execution. AMENDMENT 01 (TRACKED-LINEAGE-AMENDMENT-01-PROFILE-AND-STEP-ARITHMETIC, narrowing-only, applied before any execution, falsifies no retained evidence) fixed two defects of my own in the same day's freeze, neither of them a relaxed threshold. First, section 5 called itself the frozen training design but never specified environment_id - nor step_length_m, duty or clearance_m, the profile id pinning only the speed through its 0p7 - so no legal profile could be written from the frozen text and the missing fields would have been chosen by whoever implemented it; narrowed to motion_task_phase_observable_v5 with v5's 0.7/0.35/0.62/0.07, because this line exists to build a provenance-reconstructable stand-in for v5's warm start and the v5 environment is where the task was actually achieved, while any motion_task_v7_* would tie the line into the arm comparison it does not touch. Second, section 7.1 named checkpoints at multiples of 500000, which the mechanism cannot produce - the same class of error as the 0.98 threshold: save_freq = 500000 // 12 = 41666 and SB3 2.9.0 fires on n_calls % save_freq == 0 with num_timesteps = n_calls * n_envs, so they land at 499992/999984/1499976/1999968, and multiples of 500000 are unreachable at 12 envs because 500000/12 is not an integer; count per replicate stays 4 and the total stays 20. Realized timesteps are correspondingly 2015232 = 82 * 24576, cross-checked by the same arithmetic reproducing the seedvar line's recorded 122880 from its planned 100000, so it is measured driver behaviour rather than a guess - and 2015232 > 2000000 is NOT a raised ceiling, the ceiling being on planned_timesteps against which TL_BUDGET_EXHAUSTED is still judged. A known cosmetic defect is deliberately left alone and recorded in section 15.3: section 6's subsections run 6.1, 6.4, 6.2, 6.3, and renumbering would move cross-references that are currently correct. IMPLEMENTATION: train_ppo.py gained the third mutually exclusive tracked_lineage_protocol_id identity with the existing pilot and seedvar check order untouched line for line, as section 6.1 requires - the new request guard is a separate function rather than a branch in the existing one, since not touching it is the surest way not to reorder it - and checkpoint_interval is now read from the protocol, where the hard-coded 2000000 at line 705 meant a 2M-step run retained no intermediate checkpoint at all, which is exactly the lineage gap ROADMAP section 9 item 2 exists to close. The training seed is unreachable from the command line: the replicate index is derived from the profile id and the seed resolved from the protocol by that index, so no invocation can pair a profile with another replicate's seed. Five profiles stand_start_walk_stop_0p7_tracked_lineage_b1_r0..r4 were added. backend/tracked_lineage_contract.py is stdlib-only and fail-closed, with backend/test_tracked_lineage_contract.py carrying 65
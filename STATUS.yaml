tracked_lineage_training_v2_status: "EXECUTED_PUB_B2_NOT_ATTAINED_TL2_BUDGET_EXHAUSTED: TRACKED-LINEAGE-TRAINING-V2 (docs/TRACKED_LINEAGE_TRAINING_V2_SPEC.md sha256:ea1a56f0809f5a588c420fb8c52104fbc2b0eb10567be1baae8c152a35662289, backend/rl/tracked_lineage_training_v2_protocol.json sha256:a38662d99c6c6a25015e3ab5f8d642b0bc601be8b1d5d157d7f5e00b8d9292d0, receipt docs/TRACKED_LINEAGE_TRAINING_V2_RECEIPT_2026-09-14.md) was frozen and EXECUTED IN FULL on 2026-09-14, continuing each V1 replicate from its retained 1999968-step checkpoint with one further 2000000-step increment. RESULT LABEL TL2_BUDGET_EXHAUSTED, the same label V1 received, and it is the CONTRACT RUNNER OUTPUT rather than a hand-checked claim: backend/rl/run_tracked_lineage_v2_contract.py reads ONLY version-controlled retained evidence, runs TL2-01..TL2-09 and writes backend/tracked_lineage_evidence/2026-09-14/tl2_contract_receipt.json, so anyone can re-run it and diff. MEASURED: doubling the budget moved reward from 226.9/231.6/228.8/231.0/224.7 to 290.2/283.1/295.3/287.7/284.2 and mean duration_s from 2.477/2.680/2.520/2.811/2.440 to 2.803/3.458/2.807/2.956/2.725, while FULL EXPOSURE STAYED 0/30 ON ALL FIVE - 150 episodes, not one reaching the 9.0 s window, longest single episode 4.0 s. The extra 2000000 steps per replicate bought +51.5 to +66.5 reward and +0.145 to +0.778 s of survival against a threshold more than 5 s away. CONVERGENCE: none of the five converged, and FOUR OF THE FIVE have a final-quarter slope LARGER than their first-quarter slope (ratios 1.119, 0.636, 1.143, 1.039, 1.091; final-quarter slopes +11.8 to +22.2 per 500k where V1 measured +7.3 to +11.9), so at 4015200 steps these curves are STEEPENING, not flattening, while exposure has not moved at all. Two measurement choices were declared in code BEFORE any V2 curve existed, both taken in the direction stricter against this project's own escalation - the verdict is measured on the LINEAGE curve (V1's curve truncated at the resumed 1999968 checkpoint, then V2's) rather than the increment-only curve, and the aggregate over five replicates is any rather than all - and NEITHER CHANGED THE VERDICT: the increment-only reading agrees on every replicate and all five are False, so the pre-declaration was right to make and happened to cost nothing, which is recorded rather than overstated. EXECUTION: the arithmetic frozen before execution was hit exactly on all five - realized 4015200 (1999968 + 82 rollouts of 24576) with checkpoints at 2499960/2999952/3499944/3999936 - all 10 executions returned RUN_LOCK_BOUND under the same locked_sha256 sha256:93d23a27 as the 2026-09-08 seedvar execution, source_git_pre equalled source_git_post every time, and TL2-08 holds exactly on all five: the evaluated policy digest IS the retained reference checkpoint r<i>-3999936.zip, not the unretained policy.zip byproduct. A WITHDRAWN OBSERVATION IS KEPT ON THE RECORD: after r2, three replicates showed a clean inversion (largest reward gain paired with smallest duration gain); it was committed then, before r3 and r4 ran, with the caveat that they might erase it, and r3 erased it. What survives five replicates is weaker and firmer - the reward gain carries no usable information about the duration gain in either direction, and every replicate is 0/30 regardless. SEVEN DEFECTS were found and fixed in this line, all one of two shapes - a claim whose evidence would not survive the container, or code exercised against fixtures but never against the real frozen artefacts: (1) the V1/V2 guard dispatch let a V2 profile fall into V1's branch, because each guard had been tested alone and never the path main() takes; (2) the manifest recorded resume paths with relative_to(RL_DIR), which raises on an evidence path - widening what the guard ACCEPTS did not touch what the manifest RECORDS; (3) the retention scripts were V1-only, now a --line switch rather than a second copy; (4) TRAINING run manifests were NEVER retained, only evaluations were, so every criterion judged on a training manifest rested on a gitignored file with only its digest in the index, and a digest of a file nobody has is not evidence; (5) RUN_LOCK_BOUND was never re-derivable - the gate prints it to the console and the sidecar carries no label field, so the index literally recorded the placeholder string see gate output, which V1's still does for all five; (6) verify_checkpoint_lineage delegates to V1, which reads training_design.replicate_count, a key V2's FROZEN protocol does not carry, so the count is now derived from three frozen facts that must agree or it is a method failure, and handed over in a copy because a verifier that edits what it verifies has stopped being one; (7) the contract runner still read the absent binding label field and failed closed on all ten runs, correctly - the derivation now lives once, as run_manifest_lock.evaluate_relocated_run beside evaluate_run, since evaluate_run pins bound_manifest_path and copying evidence into version control necessarily changes that path, so the relocated form recomputes what survives the move and drops the path comparison visibly rather than approximating it. CLAIM BOUNDARY: supports that on this task, recipe and environment lock, 2000000 to 4015200 steps raised reward markedly while 30/30 was never once attained, and that the continuation line is provenance-reconstructable; does NOT support that more steps would reach 30/30 (the curve still rising is the DEFINITION of TL2_BUDGET_EXHAUSTED, not evidence it would succeed), does NOT support any method-variance or between-replicate statement (analysis unit is the training replicate, method-level denominator 5, forbidden denominators 30/150/450), does NOT support independent comparison with V1 since V2 CONTINUES V1 and not_independent_of_v1 is true, and supports no physical feasibility, safety or sim-to-real claim. ESCALATION: the frozen escalation_rule says a second TL2_BUDGET_EXHAUSTED is a RESULT and does NOT authorize simply adding budget - a V3 needs its own protocol version disclosing it was designed knowing both V1 and V2 outcomes, and paying that disclosure cost every time is the mechanism that stops indefinite escalation. STORAGE: backend/tracked_lineage_evidence/ is 77 MB and .git is 83 MB against specification section 5.3's pre-decision estimate of about 85 MB, so the measured cost landed INSIDE the accepted estimate; V1 section 4.1's requirement to re-evaluate external immutable storage before a THIRD line remains in force, judged not yet due. TESTS: full suite 1 failed / 941 passed in 507.79 s, the failure being the same pre-existing PRIMARY_CASE_RECEIPT_IDENTITY reduction-order difference recorded as a measurement and not relaxed, with no new failure; the count reconciles by measurement at four commits - 892 at 5b707cb, +32 V2 contract tests = 924 (the previously recorded 1 failed / 923 passed), +2 guard dispatch +2 resume path +8 retention lines = 936 on main after PR 20, +6 on this branch = 942. PUB-B1 remains ATTAINED and is not weakened; PUB-B2 is NOT_ATTAINED; PUB-B3 stays blocked and needs a separate protocol"
project_assessment: "ASSESSMENT_WRITTEN_OWNER_DECISION_PENDING: docs/PROJECT_ASSESSMENT_2026-09-16.md is a decision document for the project owner, not a receipt, measured from main at 095247c. Code proportion: core robotics plus app 6871 lines in 14 files, frontend 3561 lines (tsc clean, vite build passes), evidence contracts/replay/bundles 29294 lines in 42 files, tests 14768 lines (692 functions, 942 pytest cases) - core to scaffolding 1 to 4.3. Contract code on research lines the project itself marks closed, broken or exhausted (v7, second case, seed variance, tracked lineage, R0) totals about 15800 lines and 420 test functions, 54 percent of contract code and 61 percent of tests; only 76 of 692 test functions exercise the teaching application. TWO INITIAL HYPOTHESES WERE CHECKED AND OVERTURNED: there is NO unreachable code (all 21 zero-importer modules carry __main__ and are legitimate CLI entrypoints), and the fall penalty under phase_observable_v5 is -50 (base -5 plus v4 PathStopEnv -45), not -5. QUANTIFIED DIAGNOSIS of why budget did not help: control step 0.02 s; standing well earns about 2.5 per step; standing through INITIAL_STAND plus START (2.5 s, 125 steps) is about 310, minus the -50 fall is about 260, matching V1 227-232 and V2 283-295; ten replicates across two budgets all preferred the -50 fall to attempting the START to STEADY_WALK transition, so the expected cost of attempting exceeds 50, and v4 having raised the penalty to -45 without curing it shows penalty magnitude is not the binding term - the lever is curriculum, phase-conditioned shaping or the reference trajectory, not budget. EVIDENCE PROVENANCE: the seed-variance bound [-13.503408, -12.435259] pp is re-derivable from the tracked raw_replicates.json (276 KB), but the v7 pilot raw bundle (109.5 MB) and the exposure audit frozen bundle (113 MB) live in gitignored backend/run_traces/ and are NOT version-controlled - by REPOSITORY_GUIDE section 3 policy, not oversight - so the self-described strongest result is the least re-derivable line from the repository; noted in PROJECT_STATUS section 4. VALUE JUDGEMENT: weak as robotics research (no new method, no physical validation, every reconstructable training line falls at the STEADY_WALK onset); genuinely one publishable paper as evaluation-validity research (V7C false improvement, OBSERVED does not imply full exposure, Walker2d reproduction, regime taxonomy - Track A evidence is already in hand); real value as a teaching tool that is fully decoupled from the research contracts (main.py imports none, frontend calls seven contract-free endpoints, v5 policy demonstrates walking at 10 of 11 criteria); more rigorous than most published RL work as a reproducible-experiment engineering exemplar, but currently verifying a robot that does not walk. KEY OBSERVATION: PUB-B2 lost its reason on 2026-09-09 when Track A was reframed around censoring regimes - the paper no longer needs a walking reference, it needs censored examples, which every line already supplies - yet the gate remained and two further lines were spent pursuing it. ARCHITECTURE: the teaching app and the research infrastructure can be split into two products today without refactoring; closed lines are recommended for ARCHIVING (code and docs moved, evidence untouched and digests unchanged), which would reduce the suite from 942 to about 520 cases; STATUS.yaml should be restructured and docs reduced from 63 to about 12 live files. NOT to be touched: any frozen protocol or spec, any retained evidence, environment_lock plus run_manifest_lock, the v5 artifact, the 30/30 threshold and the 2000000-step ceiling. Three options with costs in section 5: converge (split, write Track A, archive - needs no PUB-B2); fix the robot by changing the lever not the budget (a disclosed V3 using the v5 walking checkpoint as a curriculum start); or continue as is (the only option not recommended). Side corrections: REPOSITORY_GUIDE tracked_lineage_evidence from not-yet-created to 40 checkpoints 77 MB, and the expected test count from 923 to 941. THE OWNER HAS NOT DECIDED"
ui_simplification: "DONE_2026-09-16_SIX_COMMITS: the frontend was reorganized in six steps on 2026-09-16 at the project owner's request, the brief being a cleaner interface with less information per page. NOTHING WAS REMOVED - every control, every warning string and every evidence token is still reachable; what changed is layout and grouping. SHELL: short title and four tab labels; the always-on 9px provenance badge bar became ONE result-state pill plus a collapsed evidence drawer that still lists every token (SOFTWARE_ONLY, simulation type, CALIBRATION_NOT_ESTABLISHED, UI config id, result config id, server config sha256, result state, run id). ANALYSIS PAGE: one parameter group at a time (gait/hardware/mass/scene); four summary cards with the rest behind a button; warnings classified - severity counts, the twelve actuator screens folded into one table keyed by joint group, short titles for the rest, original strings behind a button; one chart at a time in a collapsible strip. LIVE PAGE: controller select with a one-line hint; stand/walk/time controls resident, push/obstacle/formal-task/trace collapsed with status in their headers; decision log classified into six categories with count chips that filter and consecutive same-kind entries merged with a count. COMPARE PAGE: one toolbar plus a collapsed secondary row, Chinese titles and state, red border when fallen, one shared clock, four thresholded stat cells, scope tokens as a footer caption. TRAINING PAGE: 25 profiles grouped into six families derived only from inventory fields, frozen replicate families as tables. CHARTS (both pages): one quantity per y-axis - previously degrees shared an axis with m/s and Nm shared one with rad and percent, which flattened the small-unit series - plus a phase band on top (support phase on the analysis page, controller state on Dynamic Trace), event markers (actuator statistics window; first fall and task phases), dashed threshold lines, a hover crosshair with every series value at that time, click-to-seek, and joint colour by joint group with left solid and right dashed. BACKEND: two read-only additions only, meta.warning_items alongside meta.warnings and kind on each decision entry, both one-to-one with the existing data and carrying no new claim; no API shape, no existing string, no evidence semantic changed. TESTS: test_warning_items.py and test_decision_kind.py added; the latter fails if a backend decision key has no frontend category. Verified by tsc, vite build and Playwright screenshots of every page and expanded state. Merged as PR 23, with three follow-ups on the same line: PR 24 aligned the docs (USAGE section 3 interface overview), PR 25 added the record_start duration regression tests and retracted a wrong blocker claim, PR 26 recorded the post-rework suite measurement now held in test_suite_status; operating description in docs/USAGE.md section 3"

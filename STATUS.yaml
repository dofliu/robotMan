gate_status_single_source: "IMPLEMENTED_2026-09-17_GATE-STATUS-SINGLE-SOURCE-V1: every gate has exactly one authoritative status, registered in backend/gate_status_registry.json and checked fail-closed by backend/gate_status_contract.py (33 gates, 54 sites, 21 of them mirrors). Authorities: PUB-* in docs/PUBLICATION_PLAN.md section 5, PDR-* in docs/PAPER_DATA_READINESS.md, V0-V4 in docs/PROJECT_STATUS.md section 1. A status change that reaches some copies and not others now fails the test suite instead of sitting undetected; the four staleness failures measured 2026-09-14..16 are replayed as regression tests. Rules and the recorded gaps (VV_PLAN per-requirement rows, receipt-bound frozen criteria, derived claims such as a literature to-verify list) are in docs/GATE_STATUS_SINGLE_SOURCE.md."
module_boundary: "IMPLEMENTED_2026-09-17_MODULE-BOUNDARY-V1: one fail-closed contract checks BOTH products PROJECT_ASSESSMENT section 4.1 proposes, by one rule - a boundary transitive local import closure must equal its registered module list exactly, failing in both directions so that a foreign module entering is red AND a stale allowlist entry is red. SUPERSEDES TEACHING-BOUNDARY-V1, which ran this same code under a name that could only ever describe one of the two boundaries; the teaching rule, module list and measurements are unchanged word for word, only the name and the registry shape changed. Generalising rather than copying was deliberate: a second near-identical contract would have reproduced the exact failure shape this project spent GATE-STATUS-SINGLE-SOURCE-V1 and DERIVED-CLAIM-CONSISTENCY-V1 learning to catch - one fact, two implementations, drifting apart unwatched. TEACHING BOUNDARY: closure 15 modules / 4943 lines, no research module reachable from main, the one crossing import cut on 2026-09-17 via the stdlib-only read-only projection backend/rl/training_inventory.py whose payload is asserted byte-identical to the driver output, key order included, with train_ppo.py UNTOUCHED byte for byte so no pinned digest is affected. TOOLKIT BOUNDARY: closure is EXACTLY its own 7 modules / 5300 lines with ZERO local dependencies, while 13 non-test project modules import it - the library already sits at the bottom of the dependency graph and this keeps it there. That direction is strictly stronger than the teaching property. The boundary is enumerated, not drawn at a directory, because backend/rl/ holds both sides, and it is drawn around research MODULES not third-party weight: the teaching closure does import stable_baselines3 through controller_rl loading a PPO policy for the Live view, which is the teaching product doing its job. Registry backend/module_boundary_registry.json, contract backend/module_boundary_contract.py, 31 tests in backend/test_module_boundary_contract.py. NO FILES WERE MOVED by either split: the section 4.1 move is still to do and this makes it mechanical. Rules: docs/TEACHING_BOUNDARY.md and docs/TOOLKIT_PORTABILITY.md."
toolkit_portability: "AUDITED_2026-09-17_NOT_PORTABLE_TODAY: a clean toolkit import boundary is NOT portability and must never be read as one - MODULE-BOUNDARY-V1 checks imports, and NOTHING automatically checks portability. Measured per module: only exposure_identification (312 lines, stdlib-only) is usable by an outside project as is. environment_lock (1366 lines) is importable and usable WITHOUT MuJoCo - all three heavy imports (numpy:356, mujoco:382, torch:418/532/541) are function-local AND wrapped in try/except, verified empirically by importing it under python3 -I -S with no site-packages, so missing packages degrade three fingerprints to unavailable rather than blocking; an earlier claim by this agent that top-level heavy imports were the fatal portability issue was MEASURED FALSE and is corrected in docs/TOOLKIT_PORTABILITY.md section 7 rather than deleted. The five remaining modules are blocked by three classes. (1) FLAT SIBLING IMPORTS, fixable engineering: experiment_matrix_contract.py:22, paired_statistics_contract.py:24,29, run_manifest_lock.py:338,376,452 and rl/bind_run_lock.py:43-46 which also injects sys.path and derives REPO_ROOT from __file__. (2) CLOSED LITERAL VOCABULARIES AND A FROZEN CLAIM BOUNDARY, an OWNER DECISION this agent did not touch: experiment_matrix_contract.py:212 and paired_statistics_contract.py:156 pin evidence_scope to the single value SIM_ONLY_MUJOCO; experiment_matrix_contract.py:257 requires claim_boundary to equal FROZEN_CLAIM_BOUNDARY word for word; paper_data_contract.py:54-70 closes role to 16 values. These are not oversights - the frozen wording SIM_ONLY_MUJOCO / NOT_PHYSICALLY_VALIDATED is part of how this project keeps from overstating its claims, so widening it for portability is the owner call, and the recommendation is to let an outside project supply its own vocabulary registry with the current values as the default rather than to relax any value here. (3) A FROZEN PRODUCER REGISTRY: rl/bind_run_lock.py fails closed unless the producer is one of the four hardcoded repo-relative paths in run_manifest_lock_binding_protocol.json, so it is 100 percent closed to outsiders, and that fail-closed behaviour is CORRECT - binding mode and reason must come from a frozen protocol. TWO BUGS VERIFIED VERBATIM, NEITHER FIXED HERE because both need a decision: environment_lock.py:425 calls torch.manual_seed inside learning_fingerprint(), mutating the GLOBAL torch RNG - it does NOT bite this project because second_case_runner passes an explicit seed= to SB3 at build_model, but it blocks in-process library reuse, and fixing it would CHANGE THE FINGERPRINT VALUE and invalidate 41 committed lock records; run_manifest_lock.py:530 calls relative_to without the is_relative_to guard its own build path at line 384 uses, so an escaping symlink raises an uncaught ValueError instead of returning a typed label, which is an unlabelled failure path in a contract whose whole design is that every failure has a label. THE SECOND OF THOSE TWO IS NOW FIXED, 2026-09-18, and the earlier recommendation recorded here and in docs/TOOLKIT_PORTABILITY.md - fold it into LABEL_MISMATCH - WAS WRONG: the frozen specification section 7.1 lists 路徑逃逸 (path escape) verbatim under RUN_LOCK_BINDING_METHOD_FAILURE, and RUN_LOCK_MISMATCH's two frozen disjuncts are both MEASURABLY FALSE for an escaping symlink (the manifest bytes equal bound_manifest_sha256 and the declared path is correct relative to the run's own root), so MISMATCH would have been the downgrade section 7.2 forbids. No owner decision was needed and none was taken. The guard raises RunLockBindingError and evaluate_run's own except clause labels it; NO sixth label, NO acceptance criterion touched, and both digest-pinned files byte-identical. THE TRIGGER WAS BROADER THAN RECORDED and one shape was a FALSE PASS: measured, three inputs reached the same uncaught ValueError (escaping symlink; run_dir outside the declared root; a caller-supplied manifest_filename containing .. with no symlink at all), and a fourth - a retained directory holding a binding record plus a symlink to a manifest outside it - returned RUN_LOCK_BOUND from evaluate_relocated_run, a false pass on the one function whose whole justification is judging retained evidence. Path.resolve() on a symlink loop raises a bare RuntimeError and RunLockBindingError is itself a RuntimeError SUBCLASS, so except RunLockBindingError caught the child and let the parent through - the reason the defect was invisible on inspection; a test now asserts that class relationship directly. sha256_file's OSError is wrapped too, but that one is argument-from-code and NOT measured: this container runs as euid 0, so a chmod 000 manifest still reads. TWO CLAIMED FALSE PASSES WERE REFUTED BY MEASUREMENT and deliberately not acted on - a manifest_filename containing .. that stays inside the root, and an in-root symlink pointing at another file, both return RUN_LOCK_MISMATCH with a correct detail, so no safe_relative_path(manifest_filename) validation was added because it would have changed an already-correct label with no defect behind it. RUN_LOCK_UNBOUND ordering is a recorded decision, not an accident: the guard sits AFTER the binding-presence check because UNBOUND's frozen definition names only the absence of a binding record and says nothing about the root, and a test pins that ordering. A simpler resolved-to-resolved comparison was explicitly REFUSED: it never raises and needs no guard, but the declared path traverses the same symlink so both sides resolve to the same file, turning a substituted manifest from red into RUN_LOCK_BOUND - a threshold loosened by a result. STILL NOT FIXED, tracked separately: evaluate_run never re-derives the lock record, so deleting environment_lock.json after binding leaves the run RUN_LOCK_BOUND although the frozen label table names an unreadable lock record as a METHOD_FAILURE condition; that is a MISSING CHECK rather than an unlabelled path, so it changes what the gate asserts and needs its own decision. backend/test_run_manifest_lock.py 63 -> 71 tests, including two NEGATIVE controls proving the guard did not swallow a case that was already labelled correctly. ALSO FOUND: the producer registry field manifest_schema is frozen and NEVER READ by any code (whole-repo grep finds it only in its own JSON), so a driver could emit a different schema and nothing would say so. Full audit, classification and the six open owner decisions: docs/TOOLKIT_PORTABILITY.md."
derived_claim_consistency: "IMPLEMENTED_2026-09-17_DERIVED-CLAIM-CONSISTENCY-V1: closes the class GATE-STATUS-SINGLE-SOURCE-V1 explicitly does not cover and recorded as an open gap. A derived claim restates something computed from a source of record - the PUB-A0 priority to-verify list is a function of the U/R/S verification levels in the two literature maps - and goes stale when the source moves and the prose does not. Registered in backend/derived_claim_registry.json, checked fail-closed by backend/derived_claim_contract.py: 10 papers tracked, 1 claim, 3 sites, six rules. The strongest is NO_VERIFIED_PAPER_NAMED, which fails when the list names ANY paper the maps mark verified and so does not depend on anyone remembering to update the member list; a scan rule fails on an unregistered fifth copy. The measured instance - arXiv 1712.00378 verified 2026-09-16 while three documents kept listing it, one contradicting its own gate table - is replayed as a regression test. Still not covered, per docs/DERIVED_CLAIM_CONSISTENCY.md section 6: the maps section 4 gap judgements and the claim-to-evidence tables, which are judgements over a whole map rather than lists a rule can recompute."

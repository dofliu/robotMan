v7_candidate_selection_status: "FROZEN_NOT_PREREGISTERED_NOT_EXECUTABLE: SELECT-V7-CANDIDATE-FORMAL-V1 freezes the decision rule that could name selected_candidate_arm_id, and openly declares preregistered=false because it was authored after seeing the seed-variance result; validate_protocol enforces that declaration and its four disclosure fields, so a version claiming preregistration cannot load. Selection may decide only on SEALED_FORMAL seeds 20000-20029, because 18000-18029 are DEVELOPMENT_EXHAUSTED and inspected by this protocol's own author and 19000-19029 are retired and were used as v5 HOLDOUT; it applies once; and eligibility needs six explicit passes across SEL-C1..SEL-C6, where NOT_REACHED and NOT_APPLICABLE never count as agreement so a missing input can only block a selection. SEL-C2 requires every candidate and reference episode COMPARABLE because the exposure audit measured that all three of V7B's censored pilot episodes carried outcome_state OBSERVED with every required numeric present, and SEL-C4 requires a point-valued between_replicate_sd because an identified direction with an unestimable variance cannot size a formal study. Applied to the retained development evidence the rule selects nothing, stopped by SEL-C2 at comparable 120/150 for V7B and 0/150 for V7C against a V7A reference at 143/150 - a rule written to pass V7B would have passed it on the only data its author saw. SEL-01..SEL-09 pass over 47 tests; the protocol is frozen but must not be executed"
v7_candidate_selection_receipt: "NO_SELECTION_PERFORMED: protocol sha256:b4e16370b5744c510fa11b06343dafb3c1893711639721a406504720bbe99b58, spec sha256:bab998579bdb4f260d5c46405ad54dfc105dab975a9f78ea729aab71d3c8afb3; three execution preconditions were measured before the freeze rather than discovered during it, applying the SEEDVAR-AMENDMENT-01 lesson, and all three are BLOCKING: EP-01 the audit contract raises on SEALED_SEED_RANGE seeds, EP-02 both eval_policy.py branches pin the seed schedule, EP-03 no formal authorization. test_measured_preconditions_still_match_the_code re-verifies each claim against the code, because a stale precondition would either assert a blocker that no longer exists or hide one that appeared. A defect in my own first version was caught by test: the rule self-check failed SEL-C5 for a missing gate report on every input, so it could never have passed for any data and was no evidence at all about the rule; SEL-C5 and SEL-C6 are now NOT_APPLICABLE in self-check scope so a clean summary really does pass and the refusal on real evidence really does come from SEL-C2. On 2026-09-10 the project owner granted formal authorization (see pub_b0_authorization), which resolves EP-03 as a decision but leaves the frozen JSON, the contract and all three preconditions byte-unchanged, so the protocol remains not executable. selected_candidate_arm_id=null, method_level_power_ready=false, statistics_ready=false, paper_data_ready=false; no FORMAL data was produced and seeds 20000-20029 were not accessed"
motion_scope_decision: "NO_NEW_MOTION_TASK_DECIDED_2026-09-11: docs/MOTION_SCOPE_DECISION_2026-09-11.md records the project owner's decision not to add a jump, turn or other new motion task now, on four measured grounds rather than preference. Motion Task V1 itself has not passed - v5 reached Live 10/11 with saturation duty 38.422222% > 30%, v6 reward-only did not reduce it and v7 selected no candidate - so a second and third task would raise the number of unpassed tasks from one to three. V1 plant credibility is missing all four of articulated dynamic, known pendulum, energy balance and solver convergence, and a jump depends on exactly those: a flight phase with no contact, a landing impact governed by the contact model, and energy conservation; a jump measured on an unvalidated plant is evidence about the contact model, not about jumping. Turning and jumping early-terminate more often than walking, so they push comparisons further into the R3/R4 regimes that already defeated three budget probes, which makes Track A harder rather than easier. And adding a training line before version-controlled checkpoint lineage exists would reproduce the provenance loss that already made CONDITIONAL_ON_FIXED_WARM_START permanent for the v7 line. The decision is consistent with two rules the project already had: RL_POLICY_TRAINING requires a separate profile/protocol version for any new primitive, and ROADMAP section 8 requires contact/support acceptance for balance motions rather than visual animation. Frozen ordering: ROADMAP section 9 items 1 and 2 first, then an in-place turn once the reference policy meets the PUB-B2 exit condition, then a jump once V1 passes. The Track C teaching branch is unblocked but must be labelled DEVELOPMENT_ONLY / NOT_EVIDENCE. Nothing was trained, evaluated, added or changed by this record; the four readiness flags stay false"
r0_regime_probe: "EXECUTED_R0_WINDOW_FOUND_BOTH_CONTRASTS_PILOT: R0-REGIME-HORIZON-PROBE-V1 (docs/R0_REGIME_PROBE_SPEC.md sha256:a15cada64637800a9fa50184d0e4dec1eaad958602c296c3211b90edf031c03a, backend/rl/r0_regime_probe_protocol.json sha256:07cf6d21dbc84d299384846d21abb8e25d921da8aea9214a77c95abe7bed08fe) asks whether the only empty cell in the Track A censoring-regime taxonomy, R0 with both arms fully exposed and a non-degenerate reference metric, is reachable along the evaluation-horizon dimension. It needs no new motion task and no training: the 450 retained seed-variance episodes carry saturation_substeps_over_threshold and saturation_substeps_total per control step, 10 substeps per step at 500 Hz, so the duty over any truncation horizon is exactly recomputable. Verified before freezing, at the full horizon only: the recomputation reproduces the frozen metrics.saturation_duty_pct for 450/450 episodes with zero mismatches, saturation_substeps_total is 10 on all 158338 control steps, and every episode is COMPLETED. The design point is that R0 and non-degeneracy pull against each other - truncate early enough that nothing falls and the window is all initial stand, where the reference saturation approaches zero, which is the R5 shape the Hopper probe fell into - so the frozen adequacy rule is two-part: R0-P0a requires all 150 reference AND all 150 candidate episodes H_COVERED, and R0-P0b requires the reference arm mean duty in [5.0, 95.0] pp. R0-P0b deliberately constrains the reference only, because a floor on the candidate would select on the outcome. The horizon grid is every control step from 125 (2.5 s, the start of STEADY_WALK in the frozen phase table) to 450 (9.0 s), the selection rule takes the largest adequate horizon, and the four fail-closed labels are R0_WINDOW_FOUND, R0_EXPOSURE_ONLY, R0_NOT_REACHABLE and R0_PROBE_METHOD_FAILURE, where the two null labels are results to be reported rather than failures to be re-probed with relaxed thresholds. R0-PRE-01 is complete: backend/r0_probe_evidence/2026-09-11/horizon_trace_index.json sha256:6ad44934232e110741a69879027ccc1f84c10ae4c63b0acf2877756af0d330c7, 1272160 bytes, 450 episodes, 158338 control steps, with all 15 source digests matching the retained evaluation_output_sha256 values in the parent bundle. That extraction exists because the source control_step_trace lives only in gitignored backend/rl/artifacts/ inside an ephemeral container and cannot be regenerated, the v7 warm start being unreconstructable. Executed on 2026-09-11 at clean source edf3611, after the freeze was pushed at 06ebf60: BOTH contrasts returned R0_WINDOW_FOUND. C_B (V7B vs V7A) had 290 horizons satisfying R0-P0a, spanning 125-414, and all 290 also satisfied R0-P0b, so the rule selected H=414 (8.28 s) with a reference mean duty of 40.262319 pp; C_C (V7C vs V7A) had 28 such horizons spanning 125-152, all 28 adequate, selecting H=152 (3.04 s) at 22.089474 pp. The R5 trap the two-part rule exists to catch did not bind on this plant above the frozen 2.5 s floor: the reference mean duty never fell below 9.893333 pp anywhere in the P0a range, 3.6 times the 2.712% Hopper reference that was judged degenerate. That is a measurement about this plant and task, not a general result, and it is why non-degeneracy must be checked case by case rather than assumed. What binds the R0 window is the candidate, not the reference: each P0a upper bound equals that candidate's shortest episode (V7B 414, V7C 152; the reference's shortest is 419). The finding that matters for A-C3 is that the same policies and the same evaluation seeds move between regimes when only the horizon changes: C_B is R2 at the frozen H=450 and R0 at H<=414, and C_C is R1 at H=450 and R0 at H<=152. For C_B the transition costs 36 control steps, 0.72 s, under 8% of the horizon, because all 7 V7A and all 30 V7B early terminations fall inside FINAL_STAND, whereas all 150 V7C episodes fall at 3.04-3.28 s inside STEADY_WALK. Verification: the python -I -S recomputation is bit-exact (sha256:24451902...), the environment lock is MEASURED + FULL_LOCK with locked_sha256 byte-identical to the parent seed-variance execution, and no horizon's R0-P0b verdict depends on reduction order - left-to-right, math.fsum and reversed summation differ by at most 1e-6 while the nearest margin to a threshold is 9.893333 pp against a 5.0 pp floor. Result retained at backend/r0_probe_evidence/2026-09-11/probe_result.json sha256:f8a8db72..., receipt docs/R0_REGIME_PROBE_RECEIPT_2026-09-11.md. This is NOT a sixth independent taxonomy instance: it is the same 450 episodes re-read at a shorter horizon, so it adds a within-case demonstration that the regime is horizon-determined, not a new plant or policy family. The selected H values are data-determined, tracking each candidate's shortest episode, and are not recommended evaluation horizons. It stays PILOT, carries CONDITIONAL_ON_FIXED_WARM_START, runs on already-inspected DEVELOPMENT seeds 18000-18029, and may never be read as a statement about any arm on the 9 s task, a truncated-horizon duty being a different estimand. No threshold was relaxed: the first execution returned R0_WINDOW_FOUND"
pub_b0_authorization: "AUTHORIZATION_GRANTED_2026-09-10_PROTOCOL_STILL_NOT_EXECUTABLE_FORMAL_SEEDS_NOT_ACCESSED: docs/PUB_B0_AUTHORIZATION_RECEIPT_2026-09-10.md records the project owner's authorization of formal evaluation, granted at repository state 496cccacbb8a9e5ec1ef941ef3e2f5df0918c3a4 against protocol sha256:b4e16370b5744c510fa11b06343dafb3c1893711639721a406504720bbe99b58 (freeze parent f72814765a49e4f7141cf5482c8d029e3488f27d, preregistered=false). It is a decision record and a feasibility measurement, not evaluation evidence: no FORMAL data was produced, no candidate was selected, and seeds 20000-20029 were not accessed. Four blockers remain and all four predate the authorization: EP-03 is hard-coded \"state\": \"BLOCKING\" in the frozen protocol JSON that assert_executable reads, so it needs a narrowing-only execution-before amendment and a re-pinned PROTOCOL_SHA256; EP-01 v7_exposure_audit_contract._episode_exposure raises on any seed in SEALED_SEED_RANGE, and exposure classification is SEL-C2's own input; EP-02 both branches of rl/eval_policy.py pin the evaluation seed schedule; and PUB-B4 external preregistration, which the frozen order in PUBLICATION_PLAN section 4 places before unsealing, needs a registry account and can only be done by the project owner. The machine-readable authorization evidence was deliberately NOT minted, because _require_authorization pins protocol_sha256 and minting it would itself select the 'use the existing post-hoc rule' sub-option that is still open. Measured feasibility: SEL-C2 requires every candidate and reference episode COMPARABLE, and on the retained seed-variance summary sha256:42b4cfac2ffff47b922c2ffe8f74492a7310e5cdb637bde1201084e365027965 the counts over 5 replicates x 30 evaluation seeds are V7A_REWARD_ONLY 143/150 (p=0.953333), V7B_REDUCED_JOINT_ENVELOPE 120/150 (p=0.8) and V7C_FILTERED_ACTION 0/150; FORMAL reuses the same 15 trained policies and changes only the evaluation seeds, so the iid-extrapolated joint pass probability is 2.2e-18 for reference+V7B and exactly 0 for reference+V7C, and the structural reason is that the reference arm itself early-terminates in 3 of 5 replicates. SEL-C4 is coupled, because between_replicate_sd is null precisely on account of the censoring. Since FORMAL data may be applied only once and 20000-20029 is the only un-inspected range, executing on the v7 line would spend it for a near-certain SELECTION_COMPLETE_NO_CANDIDATE; the receipt therefore recommends reserving the range for the PUB-B1/PUB-B2 tracked training line and records the five-step order should the v7 line be chosen anyway. Nothing was changed by this record: no code, contract, protocol, threshold, arm definition or seed, and the frozen protocol JSON was verified byte-unchanged"
publication_plan_status: "PLAN_REVISED_V3_NO_MANUSCRIPT: docs/PUBLICATION_PLAN.md (PUBLICATION-PLAN-V3, 2026-09-10) keeps the three tracks and fail-closed PUB gates of V1. V2 (2026-09-09) changed only Track A; V3 changes only Track B's PUB-B0, which the project owner authorized on 2026-09-10 (see pub_b0_authorization): the gate moves from BLOCKED to AUTHORIZED_2026-09-10 / SUB_OPTION_OPEN, section 5 becomes 'authorized plus two open sub-questions' with the new sub-question (b) on which training line the single un-inspected FORMAL seed range is spent, and the frozen order still places PUB-B4 external preregistration before unsealing, so nothing became executable and no seed was accessed. On 2026-09-09 the project owner chose, among executing the Hopper protocol as probed, opening a fourth probe with a saturation floor, or stopping, to stop and reframe: Track A is now an evaluation-validity study of censoring regimes (docs/TRACK_A_REFRAME_2026-09-09.md) - early termination makes rate outcomes exposure-censored, the naive per-step estimator can assert a direction the assumption-free full-horizon bound does not support, and whether the bound is informative or the artifact is even possible depends on which censoring regime the comparison lands in, a regime set by training budget, recipe and plant that standard evaluation neither controls nor reports. Five regimes are instantiated: R1 asymmetric (v7 V7C vs V7A, frozen-bundle audit and 5-seed replication), R2 mild censoring with an informative bound but undefined between-replicate SD (v7 V7B vs V7A), R3 symmetric heavy censoring where the bound contains zero by construction (Walker2d-v5 V1, frozen protocol), R4 no adequate reference reachable within a frozen cap (Walker2d probes V1 and V2, pilots) and R5 degenerate near-zero-saturation reference selected by an exposure-only adequacy rule (Hopper probe, pilot). Contributions: A-C1 exposure censoring as an identification problem (two plants, two policy families, three regimes), A-C2 outcome_state==OBSERVED does not imply full exposure (v7 3 episodes and Walker2d 284/284), A-C3 new - censoring regime as an uncontrolled design variable and a reference-adequacy precondition that must check exposure and metric non-degeneracy, A-C4 artifact contracts including probe-as-pilot discipline, A-C5 post-hoc rule self-check demoted on 2026-09-10 to artifact level and folded into A-C4 after its supplementary scan: transparently declaring a rule post hoc is Tharking (Hollenbeck and Wright 2017, Journal of Management), isolating the decision data from the inspected data is established by Cawley and Talbot (JMLR 11, 2010) and Dwork et al (reusable holdout, 2015), and the only remaining novel sliver - applying a negative-control falsification test to a selection rule and keeping its failure evidence under a fail-closed contract - has its interpretation confounded because a rule can select nothing merely because that data is under-exposed, which is exactly what SEL-C2 measured, A-M reduction order as motivation only. Explicitly abandoned claim: that the asymmetric v7 artifact reproduces on a public benchmark; it is Limitations item 1. Probe data may only be described as the outcome label of the frozen budget-selection procedure and as an observation about the rule, never as a statement about Walker2d, Hopper or PPO recipes. Gates: PUB-A0 IN_PROGRESS at KEY_TWO_VERIFIED_AND_A_C5_SCANNED / REMAINING_U - on 2026-09-09 the project owner supplied the PDFs of the two papers the gap judgement was conditional on and both were read in full (digests in docs/LITERATURE_MAP_2026-09-08_EVALUATION_VALIDITY.md section 7): arXiv 1911.05728 (Leete, Kallus, Hudgens, Napravnik, Kosorok, stat.ME 2019) assumes conditionally independent censoring given covariates and treatment and imputes censored survival times with the conditional expected survival to obtain point estimates whose bounds are regret and convergence-rate bounds, not identification bounds, so the A-C1 gap does not close and the paper becomes the assumption-based point-identified contrast; arXiv 2606.10229 (Bedi, cs.RO 2026, single-author preprint) controls an episode-length confound in demonstration-curation metrics by design-time common-prefix truncation and never treats policy evaluation, exposure censoring or bounds, so the gap does not shrink; neither reference list cites Manski or partial identification; the A-C5 preregistration and multiverse supplementary scan was completed on 2026-09-10 (literature map section 1.7) and narrowed rather than widened the claim set; every other literature entry stays U because publisher hosts are egress-blocked, re-measured on 2026-09-10 when WebFetch to arxiv.org returned EGRESS_BLOCKED while WebSearch still worked; PUB-A1a PASS on the existing Walker2d V1 receipt; PUB-A1b CLOSED_NOT_ATTAINED, not passed and not relaxed; PUB-A2 IN_PROGRESS with the reframe as the draft, to be frozen after A0; A3-A5 NOT_STARTED. Track B remains structurally blocked and still needs a tracked training line and OSF preregistration; its PUB-B0 authorization is now granted but the protocol is still not executable, and the measured SEL-C2 infeasibility on the v7 line is why the plan recommends reserving the FORMAL range for the PUB-B1/PUB-B2 line. Track C (no learning-outcome data) is unchanged. No manuscript exists for any track; paper_data_ready=false"

run_manifest_lock_binding: "IMPLEMENTED_V1_SIDECAR_BINDING_BLOCKER_NARROWED_NOT_CLEARED: RUN-MANIFEST-LOCK-BINDING-V1 (docs/RUN_MANIFEST_LOCK_BINDING_SPEC.md sha256:717bb9103b18a0f669d517e03eeaaca91fc7de61b8a98db3d94d83f331003fec after amendment 01, protocol sha256:5202173fb5dc205100b4e11c0a896903460723dd13b5a44898b4058065cab96f) was frozen and pushed at commit 00f8e62 with no code change, then implemented. Binding is a sidecar RUN_LOCK_BINDING_V1 record that pins its manifest by SHA-256, embedded inline as well only where the manifest schema is this project's to version (PAPER_RUN_MANIFEST_V2, with a new optional environment_lock artifact role). Three measured facts forced that shape and are recorded rather than worked around: (1) the field name environment_lock_sha256 already carries the lock file bytes in second_case_evidence (sha256:911b4362) and the locked subtree digest in seed_variance_evidence (sha256:93d23a27) while both executions ran under records whose locked_sha256 is identical, so a reader comparing the two retained values would wrongly conclude different environments - the new record keeps both quantities under distinct names and refuses the ambiguous one in two places; (2) test_v7_candidate_selection_contract.py re-hashes rl/eval_policy.py against the digest pinned in SELECT-V7-CANDIDATE-FORMAL-V1, the protocol the owner authorized on 2026-09-10, so editing that driver would turn a green test red and leave the authorization pointing at a protocol that no longer exists; (3) rl/train_ppo.py is pinned by the executed seed-variance protocol with nothing re-deriving it at runtime, so editing it would silently falsify retained evidence. Consequently no pinned digest was falsified, no green test broke, no protocol amendment was needed and PROTOCOL_SHA256 was not re-pinned. Five fail-closed labels RUN_LOCK_BOUND / RUN_LOCK_UNBOUND / RUN_LOCK_INSUFFICIENT / RUN_LOCK_MISMATCH / RUN_LOCK_BINDING_METHOD_FAILURE, the last never downgraded; the gate requires satisfies_full_lock_requirement (MEASURED plus FULL_LOCK) rather than lock_class alone, and derives that flag instead of trusting it. LB-01..LB-12 pass over 62 tests, including LB-12 which re-hashes rl/train_ppo.py, rl/eval_policy.py and backend/simulator.py against the digests pinned at the freeze, so the promise not to edit them is machine-checked rather than asserted. Amended the same day by LOCKBIND-AMENDMENT-01-LB12-SCOPE: LB-12 as first written compared the CURRENT working tree, which answers 'has anyone ever edited these three files' rather than the claim its own text makes, 'did this contract edit them' - the second belongs to each file's own contract and this one has no standing to impose the first. Both readings agreed at implementation time so the defect did not surface at acceptance; they diverge only on future edits. It had to be fixed before ROADMAP section 9 item 2, because the tracked training line must edit backend/rl/train_ppo.py - line 705 sets checkpoint_interval to 2000000 for full runs, so a run under 2M timesteps saves no intermediate checkpoint and lineage is exactly what that item requires - and under the original LB-12 that edit would have turned an unrelated contract red, with the only way out being to edit a frozen acceptance criterion. LB-12 now verifies the pinned digests from git at the freeze parent 501a7ee and the implementation commit c4bd470, and a second test asserts this contract does NOT freeze those files, with ongoing protection named per file in the protocol. This relaxes no threshold: the criterion's claim is unchanged word for word and the corrected version is strictly stronger, since the original held only while the working tree happened to be clean. Measured: with train_ppo.py edited away from its pinned value all 63 tests stay green, where the original would have been red. The train_ppo.py gap - nothing re-derives its pin at runtime - is deliberately NOT patched here; the disclosure belongs to the protocol of whichever line changes the driver, and the rejected LB-13 alternative is recorded in specification section 15.4. Digests re-pinned: spec sha256:717bb910, protocol sha256:5202173f. Not cleared: a sidecar can be omitted so a direct driver invocation still yields RUN_LOCK_UNBOUND, backend/simulator.py meta.provenance stays explicitly out of scope because it enters a deterministic content hash that test_p0_contract.py independently recomputes and /api/simulate is a stateless response rather than a retained run, and the 2026-09-08 bundle is not regenerated. paper_data_ready unchanged at false; this is infrastructure, not evidence"
